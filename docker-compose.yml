# Starfish Nifty 50 Dashboard - Docker Compose
version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: starfish-db
    environment:
      POSTGRES_USER: ${DB_USER:-starfish}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-starfish}
      POSTGRES_DB: ${DB_NAME:-starfish}
    volumes:
      - starfish_db_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/migrations/:/docker-entrypoint-initdb.d/02-migrations/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-starfish}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  api:
    build: .
    container_name: starfish-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DB_URL: postgresql://${DB_USER:-starfish}:${DB_PASSWORD:-starfish}@db:5432/${DB_NAME:-starfish}
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  # Streamlit Dashboard
  dashboard:
    build: .
    container_name: starfish-dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      DB_URL: postgresql://${DB_USER:-starfish}:${DB_PASSWORD:-starfish}@db:5432/${DB_NAME:-starfish}
      API_URL: http://api:8000
      PYTHONUNBUFFERED: 1
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  # EOD Scheduler (optional - runs in background)
  scheduler:
    build: .
    command: python -m scheduler.eod_scheduler
    environment:
      DB_URL: postgresql://${DB_USER:-starfish}:${DB_PASSWORD:-starfish}@db:5432/${DB_NAME:-starfish}
      PYTHONUNBUFFERED: 1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  starfish_db_data:

networks:
  default:
    name: starfish-network